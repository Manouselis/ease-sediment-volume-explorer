<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body>
  <header class="topbar">
    <a href="../" class="brand" aria-label="EASE">
      <svg width="37" height="37" viewBox="0 0 44 44" fill="none" aria-hidden="true"><rect width="44" height="44" rx="12" fill="currentColor"/><path d="M8 15c5-5 9-5 14 0s9 5 14 0M8 23c5-5 9-5 14 0s9 5 14 0M8 31c5-5 9-5 14 0s9 5 14 0" stroke="#9ad8c5" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span><strong>EASE<span class="brand-dot">.</span></strong><small data-i18n="brandSub"></small></span>
    </a>
    <div class="topbar-tools"><span class="local-badge"><span></span><span id="runtime-badge" data-i18n="local"></span></span><div class="language-switch" role="group" data-i18n-aria="language"><button type="button" data-language="en" aria-pressed="true">EN</button><button type="button" data-language="nl" aria-pressed="false">NL</button></div></div>
  </header>
  <main class="page-shell">
    <section id="hosted-tools" class="hosted-tools" aria-labelledby="hosted-title" hidden>
      <div><h2 id="hosted-title" data-i18n="hostPublic"></h2><p data-i18n="hostDemoHint"></p></div>
      <div class="hosted-demo-controls">
        <label for="hosted-method" data-i18n="surfaceMethod"></label>
        <select id="hosted-method"><option value="tin" data-i18n="tinMethod"></option><option value="kriging" data-i18n="krigingMethod"></option></select>
        <button type="button" class="button button-primary" id="open-public-demo" data-i18n="hostLoad"></button>
      </div>
      <details id="hosted-access" hidden>
        <summary data-i18n="hostLab"></summary>
        <p data-i18n="hostPrivacy"></p>
        <form id="hosted-login">
          <label for="hosted-key" data-i18n="hostKey"></label>
          <input id="hosted-key" type="password" required autocomplete="off" spellcheck="false">
          <button class="button button-demo" type="submit" data-i18n="hostUnlock"></button>
        </form>
        <button type="button" class="button button-demo" id="hosted-lock" data-i18n="hostLock" hidden></button>
      </details>
      <p id="hosted-message" role="status"></p>
    </section>
    <section class="intro"><p class="eyebrow" data-i18n="eyebrow"></p><h1 data-i18n="title"></h1><p class="intro-copy" data-i18n="intro"></p></section>
    <div class="app-layout">
      <aside class="setup-panel">
        <div class="panel-heading"><h2 data-i18n="setup"></h2><p data-i18n="setupSub"></p></div>
        <form id="analysis-form" novalidate>
          <fieldset id="setup-fields" class="fieldset-reset">
            <div class="demo-block"><button type="button" id="load-demo" class="button button-demo"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m12 3 2.7 5.5L21 9.4l-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.4l6.3-.9Z"/></svg><span data-i18n="demo"></span></button><p class="field-hint" data-i18n="demoHint"></p><div id="demo-source" class="source-card" hidden></div></div>
            <section class="form-section"><h3><span class="step-number">01</span><span data-i18n="stepData"></span></h3>
              <div class="dropzone" id="survey-drop"><input type="file" id="survey-file" accept=".csv,.txt,.xyz,.tif,.tiff,.zip" class="file-input" data-i18n-aria="surveyUpload"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 15v5h16v-5M12 16V3m-5 5 5-5 5 5"/></svg><strong data-i18n="surveyUpload"></strong><span data-i18n="browse"></span></div>
              <div class="file-selection" id="survey-selection" hidden><span id="survey-name"></span><button type="button" data-remove="survey" data-i18n="remove"></button></div>
              <p class="field-hint" data-i18n="supported"></p>
              <div class="field"><label for="crs" data-i18n="crs"></label><input id="crs" name="crs" value="EPSG:28992" spellcheck="false" required><p class="field-hint" data-i18n="crsHint"></p></div>
              <div class="field"><label for="vertical-datum" data-i18n="datum"></label><input id="vertical-datum" name="vertical_datum" value="NAP" data-i18n-placeholder="datumPlaceholder" required><p class="field-hint" data-i18n="datumHint"></p></div>
              <div class="field"><label for="z-convention" data-i18n="zConvention"></label><select id="z-convention"><option value="elevation" data-i18n="elevation"></option><option value="depth" data-i18n="depth"></option></select><p class="field-hint" data-i18n="zHint"></p></div>
              <label class="profile-check"><input id="survey-preprocess" type="checkbox"><span data-i18n="surveyPreprocess"></span></label>
              <div class="field" id="survey-sounding-field" hidden>
                <label for="survey-sounding" data-i18n="profileSounding"></label><input id="survey-sounding" type="file">
                <p class="field-hint" data-i18n="profileSoundingHint"></p>
              </div>
              <label class="profile-check" id="survey-nap-label" hidden><input id="survey-nap-confirmed" type="checkbox"><span data-i18n="profileNAPConfirmed"></span></label>
              <button type="button" id="inspect-survey" class="button button-demo inspect-button" data-i18n="inspectSurvey"></button><p class="field-hint" data-i18n="inspectHint"></p>
            </section>
            <section class="form-section"><h3><span class="step-number">02</span><span data-i18n="stepReference"></span></h3>
              <div class="field"><label for="reference-type" data-i18n="refType"></label><select id="reference-type"><option value="design" data-i18n="design"></option><option value="previous" data-i18n="previous"></option><option value="underside" data-i18n="underside"></option></select><p class="field-hint ref-interpretation" id="reference-type-hint"></p></div>
              <div class="field"><label for="reference-mode" data-i18n="refMode"></label><select id="reference-mode"><option value="profile" data-i18n="profileMode" selected></option><option value="constant" data-i18n="constant"></option><option value="file" data-i18n="file"></option></select><p class="field-hint" id="reference-required-hint" hidden data-i18n="referenceRequiresFile"></p></div>
              <div id="constant-fields" hidden><div class="field"><label for="reference-elevation" data-i18n="refElevation"></label><div class="unit-input"><input id="reference-elevation" type="number" value="-6.5" step="0.1"><span>m</span></div><p class="field-hint" data-i18n="refElevationHint"></p></div></div>
              <div id="reference-file-fields" hidden>
                <div class="dropzone compact" id="reference-drop"><input type="file" id="reference-file" accept=".csv,.txt,.xyz,.tif,.tiff,.zip" class="file-input" data-i18n-aria="refUpload"><strong data-i18n="refUpload"></strong><span data-i18n="browse"></span></div>
                <div class="file-selection" id="reference-selection" hidden><span id="reference-name"></span><button type="button" data-remove="reference" data-i18n="remove"></button></div><p class="field-hint" data-i18n="refSupported"></p>
                <div class="reference-metadata"><h4 data-i18n="refMetadata"></h4><p class="field-hint" data-i18n="sameMetadata"></p><div class="field"><label for="reference-crs" data-i18n="crs"></label><input id="reference-crs" value="EPSG:28992" spellcheck="false"></div><div class="field"><label for="reference-datum" data-i18n="datum"></label><input id="reference-datum" value="NAP"></div><div class="field"><label for="reference-z-convention" data-i18n="zConvention"></label><select id="reference-z-convention"><option value="elevation" data-i18n="elevation"></option><option value="depth" data-i18n="depth"></option></select></div></div>
              </div>
              <div id="profile-fields" hidden>
                <p class="field-hint" data-i18n="profileHint"></p>
                <div class="field"><label for="profile-code" data-i18n="profileCode"></label><select id="profile-code"><option>L8</option><option value="L8A">L8a</option><option>L10</option></select></div>
                <div class="field"><label for="profile-water" data-i18n="profileWater"></label><input id="profile-water" type="number" step="any" placeholder="-5.70"></div>
                <label class="profile-check"><input id="profile-level-confirmed" type="checkbox"><span data-i18n="profileLevelConfirmed"></span></label>
                <div class="field"><label for="profile-coverage" data-i18n="profileCoverage"></label><select id="profile-coverage"><option value="track" data-i18n="profileTrack"></option><option value="area" data-i18n="profileArea"></option></select><p class="field-hint" id="profile-coverage-hint"></p></div>
                <div class="field"><label for="profile-alignment" data-i18n="profileAlignment"></label><select id="profile-alignment"><option value="fitted" data-i18n="profileFitted"></option><option value="endpoints" data-i18n="profileEndpoints"></option></select></div>
                <div id="profile-endpoints" hidden>
                  <p class="field-hint" data-i18n="profileEndpointsHint"></p>
                  <div class="area-fields">
                    <div class="field"><label for="profile-x1">X1</label><input id="profile-x1" type="number" step="any"></div>
                    <div class="field"><label for="profile-y1">Y1</label><input id="profile-y1" type="number" step="any"></div>
                    <div class="field"><label for="profile-x2">X2</label><input id="profile-x2" type="number" step="any"></div>
                    <div class="field"><label for="profile-y2">Y2</label><input id="profile-y2" type="number" step="any"></div>
                  </div>
                </div>
              </div>
              <div class="field"><label for="reference-note" data-i18n="referenceNote"></label><textarea id="reference-note" rows="3" maxlength="1000" data-i18n-placeholder="referenceNotePlaceholder" required></textarea><p class="field-hint" id="reference-note-hint" data-i18n="referenceNoteHint"></p></div>
            </section>
            <fieldset class="fieldset-reset form-section" id="volume-settings"><h3><span class="step-number">03</span><span data-i18n="stepSettings"></span></h3>

              <div class="field"><label for="surface-method" data-i18n="surfaceMethod"></label><select id="surface-method"><option value="tin" data-i18n="tinMethod"></option><option value="kriging" data-i18n="krigingMethod"></option></select><p class="field-hint" data-i18n="surfaceHint"></p></div>
              <div id="kriging-fields" hidden>
                <div class="field"><label for="kriging-model" data-i18n="variogramModel"></label><select id="kriging-model"><option value="spherical" data-i18n="spherical"></option><option value="exponential" data-i18n="exponential"></option><option value="gaussian" data-i18n="gaussian"></option></select></div>
                <div class="field"><label for="kriging-fit" data-i18n="fitMode"></label><select id="kriging-fit"><option value="auto" data-i18n="fitAuto"></option><option value="manual" data-i18n="fitManual"></option></select><p class="field-hint" data-i18n="fitHint"></p></div>
                <div id="kriging-manual" hidden>
                  <div class="field"><label for="kriging-nugget" data-i18n="nugget"></label><input id="kriging-nugget" type="number" min="0" max="10000" step="any" value="0.005"><p class="field-hint" data-i18n="nuggetHint"></p></div>
                  <div class="field"><label for="kriging-partial-sill" data-i18n="partialSill"></label><input id="kriging-partial-sill" type="number" min="0.000001" max="10000" step="any" value="0.2"><p class="field-hint" data-i18n="sillHint"></p></div>
                  <div class="field"><label for="kriging-range" data-i18n="krigingRange"></label><input id="kriging-range" type="number" min="0.000001" max="100000" step="any" value="20"><p class="field-hint" data-i18n="rangeHint"></p></div>
                </div>
                <details class="advanced-settings"><summary data-i18n="krigingAdvanced"></summary><div class="advanced-content">
                  <div class="field"><label for="kriging-neighbors" data-i18n="krigingNeighbors"></label><input id="kriging-neighbors" type="number" min="3" max="64" step="1" value="16"></div>
                  <div class="field"><label for="kriging-radius" data-i18n="krigingRadius"></label><input id="kriging-radius" type="number" min="0.000001" max="10000" step="any" value="20"><p class="field-hint" data-i18n="radiusHint"></p></div>
                  <div class="field"><label for="kriging-max-se" data-i18n="maxSE"></label><input id="kriging-max-se" type="number" min="0" max="100" step="any" data-i18n-placeholder="optional"><p class="field-hint" data-i18n="seHint"></p></div>
                </div></details>
                <p class="field-hint" data-i18n="krigingLimits"></p>
              </div>
              <div class="field-row"><div class="field"><label for="cell-size" data-i18n="cellSize"></label><div class="unit-input"><input id="cell-size" type="number" value="1" min="0.05" max="1000" step="0.1"><span>m</span></div></div><div class="field"><label for="max-edge" data-i18n="maxEdge"></label><div class="unit-input"><input id="max-edge" type="number" value="3" min="0.05" max="10000" step="1"><span>m</span></div></div></div><p class="field-hint" data-i18n="gridHint"></p>
              <div class="field"><label for="filter-mode" data-i18n="filter"></label><select id="filter-mode"><option value="off" data-i18n="filterOff"></option><option value="flag" data-i18n="filterFlag" selected></option><option value="exclude" data-i18n="filterExclude"></option></select><p class="field-hint" data-i18n="filterHint"></p></div>
              <details class="advanced-settings"><summary data-i18n="advanced"></summary><div class="advanced-content"><div class="field-row"><div class="field"><label for="filter-k" data-i18n="filterK"></label><input id="filter-k" type="number" min="2" max="20" step="0.5" value="4.5"></div><div class="field"><label for="filter-floor" data-i18n="filterFloor"></label><div class="unit-input"><input id="filter-floor" type="number" min="0.001" max="100" step="0.05" value="0.25"><span>m</span></div></div></div><div class="field"><label for="neighbors" data-i18n="neighbors"></label><input id="neighbors" type="number" min="6" max="64" step="1" value="16"></div><div class="field"><label for="sigma-current" data-i18n="sigmaCurrent"></label><input id="sigma-current" type="number" min="0" max="100" step="0.01" data-i18n-placeholder="optional"></div><div class="field"><label for="sigma-reference" data-i18n="sigmaReference"></label><input id="sigma-reference" type="number" min="0" max="100" step="0.01" data-i18n-placeholder="optional"></div><p class="field-hint" data-i18n="uncertaintyHint"></p><div class="field"><label for="boundary-file" data-i18n="boundary"></label><div class="boundary-input"><input type="file" id="boundary-file" accept=".geojson,.json" class="file-input"><span id="boundary-name" data-i18n="boundaryUpload"></span></div><button id="remove-boundary" class="text-button" type="button" data-i18n="remove" hidden></button><p class="field-hint" data-i18n="boundaryHint"></p></div></div></details>
            </fieldset>
          </fieldset>
          <div class="run-block"><div id="form-error" class="form-error" role="alert" hidden></div><button type="submit" class="button button-primary" id="run-analysis"><span id="run-icon" aria-hidden="true">↗</span><span id="run-label" data-i18n="run"></span></button><p id="run-privacy" class="field-hint" data-i18n="runHint"></p></div>
        </form>
        <div class="echo-note"><span class="info-icon" aria-hidden="true">i</span><details><summary data-i18n="echoTitle"></summary><p data-i18n="echoText"></p></details></div>
      </aside>
      <section class="workspace" data-i18n-aria="workspace">
        <div class="workspace-header"><h2 data-i18n="workspace"></h2><span class="workspace-status" id="workspace-status"><span></span><span id="status-text" data-i18n="ready"></span></span></div>
        <div id="stale-note" class="stale-note" role="status" hidden data-i18n="stale"></div>
        <section id="survey-preview" class="detail-card survey-preview" hidden>
          <div class="detail-heading"><h3 data-i18n="previewTitle"></h3><p data-i18n="previewIntro"></p></div>
          <dl id="preview-stats" class="quality-grid"></dl>
          <p id="preprocess-preview-note" class="preview-height-note" data-i18n="preprocessPreviewHint" hidden></p>
          <p id="preview-height-note" class="preview-height-note" data-i18n="previewMixedHeights" hidden></p>
          <div class="preview-toolbar">
            <div class="view-switch" role="group" data-i18n-aria="previewViews">
              <button type="button" data-preview-view="3d" aria-pressed="true" data-i18n="preview3d"></button>
              <button type="button" data-preview-view="plan" aria-pressed="false" data-i18n="previewPlan"></button>
            </div>
            <div id="preview-3d-controls" class="preview-3d-controls">
              <div class="bed-scale-field">
                <label for="preview-vertical-scale" data-i18n="verticalScale"></label>
                <select id="preview-vertical-scale">
                  <option value="auto" data-i18n="verticalAuto"></option>
                  <option value="1" data-i18n="verticalTrue"></option>
                </select>
              </div>
              <button type="button" id="reset-preview-camera" class="bed-reset" data-i18n="resetBedView"></button>
            </div>
          </div>
          <div id="survey-preview-chart" role="img" data-i18n-aria="previewTitle"></div>
          <div class="preview-actions"><p id="preview-plot-note" class="field-hint"></p><button type="button" id="use-preview-area" class="button button-demo" data-i18n="useVisibleArea" hidden></button><button type="button" id="clear-preview-area" class="text-button" data-i18n="clearArea" hidden></button><p id="preview-area-note" class="field-hint" role="status"></p>
            <details><summary data-i18n="manualArea"></summary><div class="area-fields"><div class="field"><label for="area-xmin">X min (m)</label><input id="area-xmin" type="number" step="any"></div><div class="field"><label for="area-ymin">Y min (m)</label><input id="area-ymin" type="number" step="any"></div><div class="field"><label for="area-xmax">X max (m)</label><input id="area-xmax" type="number" step="any"></div><div class="field"><label for="area-ymax">Y max (m)</label><input id="area-ymax" type="number" step="any"></div></div><button type="button" id="apply-preview-area" class="button button-demo" data-i18n="applyArea"></button></details>
            <p id="preview-grid-note" class="field-hint"></p><p class="field-hint" data-i18n="previewDatumNote"></p>
          </div>
        </section>
        <section id="profile-result" class="detail-card survey-preview" hidden>
          <div class="detail-heading"><h3 data-i18n="profileResult"></h3><p id="profile-result-note"></p></div>
          <dl id="profile-stats" class="quality-grid"></dl>
          <p id="profile-provisional" class="preview-height-note" data-i18n="profileProvisional"></p>
          <div class="preview-toolbar"><div class="view-switch" role="group" data-i18n-aria="profileResult">
            <button type="button" data-profile-view="3d" aria-pressed="true" data-i18n="profile3D"></button>
            <button type="button" data-profile-view="along" aria-pressed="false" data-i18n="profileAlong"></button>
          </div></div>
          <div id="profile-chart" role="img" data-i18n-aria="profileResult"></div>
          <div class="preview-actions"><p id="profile-scale-note" class="field-hint"></p>
            <div class="export-links">
              <a id="export-design" download data-i18n="profileExportDesign"></a>
              <a id="export-comparison" download data-i18n="profileExportComparison"></a>
              <a id="profile-export-bundle" download data-i18n="bundle"></a>
            </div>
          </div>
        </section>
        <div class="chart-card" id="analysis-chart-card">
          <div id="chart-toolbar" class="chart-toolbar" hidden><div class="view-switch" role="group"><button type="button" data-view="difference" aria-pressed="true" data-i18n="difference"></button><button type="button" data-view="bed" aria-pressed="false" data-i18n="bed"></button><button type="button" id="uncertainty-view" data-view="uncertainty" aria-pressed="false" data-i18n="uncertainty" hidden></button><button type="button" data-view="map" aria-pressed="false" data-i18n="map"></button></div><span id="chart-crs" class="chart-crs"></span></div>
          <div id="uncertainty-controls" class="bed-controls" hidden><div class="field"><label for="uncertainty-role" data-i18n="uncertaintyRole"></label><select id="uncertainty-role"><option value="bed" data-i18n="stepData"></option><option value="reference" id="reference-uncertainty-option" data-i18n="stepReference"></option></select></div><p class="field-hint" data-i18n="uncertaintyMapHint"></p></div>
          <div id="bed-controls" class="bed-controls" hidden>
            <div class="bed-scale-field"><label for="vertical-scale" data-i18n="verticalScale"></label><select id="vertical-scale"><option value="auto" data-i18n="verticalAuto" selected></option><option value="1" data-i18n="verticalTrue"></option><option value="5">5×</option><option value="10">10×</option><option value="20">20×</option><option value="50">50×</option></select></div>
            <div class="bed-view-actions">
              <button type="button" id="focus-bed-patch" class="bed-reset" hidden></button>
              <button type="button" id="reset-bed-view" class="bed-reset" data-i18n="resetBedView"></button>
            </div>
            <p id="vertical-scale-note" role="status"></p>
            <p id="bed-sparse-note" class="bed-sparse-note" role="status" hidden></p>
          </div>
          <div id="chart-empty" class="chart-empty">
            <svg class="empty-graphic" viewBox="0 0 460 210" fill="none" aria-hidden="true"><defs><linearGradient id="bed-fill" x1="100" y1="80" x2="300" y2="230" gradientUnits="userSpaceOnUse"><stop stop-color="#a1d6c2" stop-opacity=".7"/><stop offset="1" stop-color="#227d83" stop-opacity=".16"/></linearGradient></defs><path d="M35 119 224 22 423 117 232 214Z" fill="#e9eeea"/><path d="m35 91 189-66 199 65-191 92Z" fill="url(#bed-fill)" stroke="#73afa1" stroke-width="1.4"/><path d="m35 91 39 10 40-13 40 11 39-30 40 11 40-18 39 12 40-4 39 11 32 9M73 78l39 10 40-12 40 11 39-30 40 11 40-17 39 11 40-4M112 64l39 11 40-12 40 11 40-30 40 11 40-16M151 51l39 11 40-12 40 11 40-30M191 37l39 12 40-12M74 101l38 32m2-45 38 27m2-16 38 14m1-44 39 113M233 80l40 82m0-100 39 80m0-68 40 49m0-53 40 33" stroke="#5a9d91" opacity=".5"/><path d="m35 152 189-97 199 95" stroke="#d49b54" stroke-width="1.5" stroke-dasharray="5 6"/><circle cx="193" cy="69" r="4" fill="#15525d"/><circle cx="273" cy="62" r="4" fill="#15525d"/><circle cx="352" cy="70" r="4" fill="#15525d"/></svg>
            <h3 data-i18n="emptyTitle"></h3><p data-i18n="emptyText"></p><div class="empty-steps"><span data-i18n="emptyStep1"></span><span data-i18n="emptyStep2"></span><span data-i18n="emptyStep3"></span></div>
          </div>
          <div id="chart" hidden></div><div id="chart-footer" class="chart-footer" hidden><span data-i18n="chartHelp"></span><span id="chart-summary"></span></div>
          <div id="processing-overlay" class="processing-overlay" hidden><span class="spinner"></span><strong data-i18n="running"></strong></div>
